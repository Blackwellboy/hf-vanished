name: Poll Hub

on:
  schedule:
    # Every 6h, deliberately off the top of the hour to reduce Actions schedule congestion.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # A code/watchlist change gets one immediate refresh. Bot data commits made
  # with GITHUB_TOKEN do not recursively trigger another run.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/seeds.json"
      - "data/reasons.json"
      - "data/mirrors.json"
      - ".github/workflows/poll.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll-hub
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll public Hub API + Wayback CDX
        run: python3 scripts/poll_forever.py

      - name: Capture forensic evidence, manifests and incident signals
        # Additive/fail-soft evidence layer. Existing v1 ledger remains authoritative
        # even if an optional public HF evidence endpoint is unavailable.
        run: python3 scripts/evidence.py

      - name: Build explicit model lineage
        run: python3 scripts/lineage.py

      - name: Probe recovery integrations
        run: python3 scripts/integrations.py

      - name: Build forensic analytics
        run: python3 scripts/analytics.py

      - name: Build deterministic provenance digest
        run: python3 scripts/provenance.py

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless-sign provenance digest
        id: sigstore
        continue-on-error: true
        run: |
          rm -f data/provenance.sigstore.json
          cosign sign-blob --yes --bundle data/provenance.sigstore.json data/provenance.json

      - name: Validate generated data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = json.loads(Path('data/events.json').read_text())
          state = json.loads(Path('data/state.json').read_text())
          status = json.loads(Path('data/status.json').read_text())
          integrations = json.loads(Path('data/integrations.json').read_text())
          reasons = json.loads(Path('data/reasons.json').read_text())
          evidence = json.loads(Path('data/evidence.json').read_text())
          manifests = json.loads(Path('data/manifests.json').read_text())
          incidents = json.loads(Path('data/incidents.json').read_text())
          lineage = json.loads(Path('data/lineage.json').read_text())
          analytics = json.loads(Path('data/analytics.json').read_text())
          mirrors = json.loads(Path('data/mirrors.json').read_text())
          provenance = json.loads(Path('data/provenance.json').read_text())
          assert events.get('schema') == 'hf-vanished.events.v1'
          assert isinstance(events.get('events'), list)
          assert isinstance(state.get('models'), dict)
          assert status.get('schema') == 'hf-vanished.status.v1'
          assert isinstance(status.get('models'), dict)
          assert status.get('summary', {}).get('watched') == len(state['models'])
          assert integrations.get('schema') == 'hf-vanished.integrations.v1'
          assert isinstance(integrations.get('pirateface', {}).get('models'), dict)
          assert reasons.get('schema') == 'hf-vanished.reasons.v1'
          assert isinstance(reasons.get('models'), dict)
          assert evidence.get('schema') == 'hf-vanished.evidence.v1'
          assert isinstance(evidence.get('models'), dict)
          assert manifests.get('schema') == 'hf-vanished.manifest.v1'
          assert isinstance(manifests.get('models'), dict)
          assert incidents.get('schema') == 'hf-vanished.incidents.v1'
          assert isinstance(incidents.get('incidents'), list)
          assert lineage.get('schema') == 'hf-vanished.lineage.v1'
          assert isinstance(lineage.get('nodes'), dict) and isinstance(lineage.get('edges'), list)
          assert analytics.get('schema') == 'hf-vanished.analytics.v1'
          assert mirrors.get('schema') == 'hf-vanished.mirrors.v1'
          assert provenance.get('schema') == 'hf-vanished.provenance.v1'
          assert provenance.get('root_sha256') and len(provenance['root_sha256']) == 64
          for mid, rec in evidence.get('models', {}).items():
              reason = rec.get('reason') or {}
              if reason.get('status') != 'UNKNOWN':
                  assert reason.get('sources'), f'{mid}: sourced reason required'
              assert rec.get('evidence_sha256'), f'{mid}: evidence hash missing'
          print(
              f"events={len(events['events'])} watched={len(state['models'])} "
              f"evidence={len(evidence['models'])} incidents={len(incidents['incidents'])} "
              f"lineage_edges={len(lineage['edges'])} sourced_reasons={analytics['summary']['sourced_reasons']} "
              f"provenance={provenance['root_sha256'][:12]} "
              f"rescued={status.get('summary', {}).get('rescued', 0)} "
              f"pf_cached={len(integrations['pirateface']['models'])}"
          )
          PY

      - name: Commit ledger updates
        run: |
          git config user.name "hf-vanished-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/state.json data/status.json data/integrations.json \
                  data/evidence.json data/manifests.json data/incidents.json data/lineage.json \
                  data/analytics.json data/provenance.json
          if [ -f data/provenance.sigstore.json ]; then git add data/provenance.sigstore.json; fi
          if git diff --staged --quiet; then
            echo "No ledger changes"
          else
            git commit -m "chore: refresh HF Vanished ledger and forensic evidence"
            # A human/code commit can land while this scan is running. Rebase
            # the generated data commit onto current main before pushing so an
            # unrelated edit cannot make the autonomous scan fail.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # The bot push above does not reliably re-trigger another workflow,
      # so this run publishes the refreshed static site itself.
      - name: Stage site bundle
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/assets
          cp data/events.json _site/data/events.json
          cp data/state.json _site/data/state.json
          cp data/status.json _site/data/status.json
          cp data/integrations.json _site/data/integrations.json
          cp data/evidence.json _site/data/evidence.json
          cp data/manifests.json _site/data/manifests.json
          cp data/incidents.json _site/data/incidents.json
          cp data/reasons.json _site/data/reasons.json
          cp data/lineage.json _site/data/lineage.json
          cp data/analytics.json _site/data/analytics.json
          cp data/mirrors.json _site/data/mirrors.json
          cp data/provenance.json _site/data/provenance.json
          if [ -f data/provenance.sigstore.json ]; then cp data/provenance.sigstore.json _site/data/provenance.sigstore.json; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
