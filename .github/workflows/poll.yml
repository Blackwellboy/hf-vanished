name: Poll Hub

on:
  schedule:
    # ~every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll-hub
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll public Hub API + Wayback CDX
        run: python3 scripts/poll.py

      - name: Commit ledger updates
        run: |
          git config user.name "hf-vanished-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/state.json
          if git diff --staged --quiet; then
            echo "No ledger changes"
          else
            git commit -m "chore: refresh events.json from Hub poll"
            git push
          fi

      # GITHUB_TOKEN pushes do not re-trigger workflow runs, so deploy Pages here.
      - name: Stage site bundle
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/assets
          mkdir -p _site/data
          cp data/events.json _site/data/events.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
