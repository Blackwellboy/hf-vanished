name: Poll Hub

on:
  schedule:
    # ~every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-hub
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll public Hub API + Wayback CDX
        run: python3 scripts/poll.py

      - name: Commit ledger updates
        run: |
          git config user.name "hf-vanished-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/state.json
          if git diff --staged --quiet; then
            echo "No ledger changes"
          else
            git commit -m "chore: refresh events.json from Hub poll"
            git push
          fi
