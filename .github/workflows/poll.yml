name: Poll Hub

on:
  schedule:
    # Every 6h, deliberately off the top of the hour to reduce Actions schedule congestion.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll-hub
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll public Hub API + Wayback CDX
        run: python3 scripts/poll.py

      - name: Validate generated ledger
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = json.loads(Path('data/events.json').read_text())
          state = json.loads(Path('data/state.json').read_text())
          assert events.get('schema') == 'hf-vanished.events.v1'
          assert isinstance(events.get('events'), list)
          assert isinstance(state.get('models'), dict)
          print(f"events={len(events['events'])} watched={len(state['models'])}")
          PY

      - name: Commit ledger updates
        run: |
          git config user.name "hf-vanished-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/state.json
          if git diff --staged --quiet; then
            echo "No ledger changes"
          else
            git commit -m "chore: refresh HF Vanished ledger"
            git push
          fi

      # The bot push above does not reliably re-trigger another workflow,
      # so the scheduled poll publishes the refreshed static site itself.
      - name: Stage site bundle
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/assets
          cp data/events.json _site/data/events.json
          cp data/state.json _site/data/state.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
