name: Report a vanished / restricted model
description: Submit a public model for HF Vanished verification.
title: "[MODEL] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks. HF Vanished records observable availability changes and does not infer motive without a source.
        Please submit public-safe evidence only. Do not paste private dumps, tokens, credentials, or non-public correspondence.
  - type: input
    id: model
    attributes:
      label: Model ID
      description: Hugging Face org/model identifier.
      placeholder: org/model
    validations:
      required: true
  - type: input
    id: hf_url
    attributes:
      label: Hugging Face URL
      placeholder: https://huggingface.co/org/model
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: What changed?
      options:
        - Deleted / 404
        - Disabled
        - Private / auth required
        - Newly gated
        - Weight or model files removed
        - Restored / public again
        - Unknown / not sure
    validations:
      required: true
  - type: input
    id: last_seen
    attributes:
      label: Approximate last time you saw it public
      placeholder: 2026-09-01 or "about two weeks ago"
  - type: input
    id: archive
    attributes:
      label: Archive / previous-public proof
      description: Wayback, old model-card link, release note, documentation or other public evidence.
      placeholder: https://web.archive.org/...
  - type: dropdown
    id: reason_category
    attributes:
      label: Is there a publicly documented reason?
      description: Choose Unknown unless a public source explicitly states the cause.
      options:
        - Unknown / no sourced reason
        - Author action
        - Legal action / takedown
        - Licensing
        - Moderation / platform action
        - Safety policy
        - Terms of service
        - Distribution change
        - Other sourced reason
    validations:
      required: true
  - type: input
    id: reason_source
    attributes:
      label: Public source for the reason
      description: Platform statement, owner statement, legal notice, public issue/discussion, release note, or other verifiable source. Leave blank if unknown.
      placeholder: https://...
  - type: input
    id: discussion
    attributes:
      label: Relevant Hugging Face discussion / comment
      description: Optional public discussion that may contain useful context. A discussion is evidence to inspect, not automatic proof of motive.
      placeholder: https://huggingface.co/org/model/discussions/123
  - type: textarea
    id: hashes
    attributes:
      label: Known file hashes / snapshot identity
      description: Optional public SHA-256, LFS OID, Xet hash, torrent checksum, manifest hash, or revision. Include the source if possible.
      placeholder: "filename — sha256... — source URL"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything useful for verification. Please separate observation from guesses about the reason.
  - type: checkboxes
    id: public_safe
    attributes:
      label: Public-safe submission
      options:
        - label: I have not included private credentials, tokens, private evidence dumps, or non-public correspondence.
          required: true
